name: agentic-discovery-platform

services:
  arcadedb:
    build:
      context: ./platform/arcadedb
    hostname: arcadedb
    environment:
      ARCADEDB_ROOT_PASSWORD: ${ARCADEDB_ROOT_PASSWORD}
      ARCADEDB_USER: ${ARCADEDB_USER}
      ARCADEDB_PASSWORD: ${ARCADEDB_PASSWORD}
      ARCADEDB_DATABASE: ${ARCADEDB_DATABASE}
      ARCADEDB_SETTINGS: -Darcadedb.server.rootPassword=${ARCADEDB_ROOT_PASSWORD}
    ports:
      - "2480:2480"
      - "2424:2424"
    volumes:
      - agentic_discovery_platform_arcadedb_data:/home/arcadedb/databases
    networks:
      - platform

  backend:
    build:
      context: ./platform/backend
    env_file:
      - ./platform/backend/.env
    hostname: backend
    environment:
      ARCADEDB_ROOT_PASSWORD: ${ARCADEDB_ROOT_PASSWORD}
      ARCADEDB_HOST: arcadedb
      ARCADEDB_PORT: ${ARCADEDB_PORT:-2480}
      ARCADEDB_DATABASE: ${ARCADEDB_DATABASE}
      ARCADEDB_USER: ${ARCADEDB_USER}
      ARCADEDB_PASSWORD: ${ARCADEDB_PASSWORD}
      RELIABILITY_THRESHOLD: ${RELIABILITY_THRESHOLD:-0.75}
      DISCOVERY_MODE: ${DISCOVERY_MODE:-cached}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ENABLE_GITHUB_DISCOVERY: ${ENABLE_GITHUB_DISCOVERY:-false}
      ENABLE_MCP_REGISTRY_DISCOVERY: ${ENABLE_MCP_REGISTRY_DISCOVERY:-false}
      ENABLE_A2A_REGISTRY_DISCOVERY: ${ENABLE_A2A_REGISTRY_DISCOVERY:-false}
      ENABLE_WEB_SEARCH_DISCOVERY: ${ENABLE_WEB_SEARCH_DISCOVERY:-false}
      ENABLE_WEB_EXTRACTION: ${ENABLE_WEB_EXTRACTION:-false}
      WEB_EXTRACTION_URLS: ${WEB_EXTRACTION_URLS:-}
      WEB_EXTRACTION_TIMEOUT_SECONDS: ${WEB_EXTRACTION_TIMEOUT_SECONDS:-10}
      WEB_EXTRACTION_MAX_REDIRECTS: ${WEB_EXTRACTION_MAX_REDIRECTS:-5}
      WEB_EXTRACTION_MAX_RESPONSE_BYTES: ${WEB_EXTRACTION_MAX_RESPONSE_BYTES:-2097152}
      WEB_EXTRACTION_RESPECT_ROBOTS: ${WEB_EXTRACTION_RESPECT_ROBOTS:-true}
      WEB_EXTRACTION_USER_AGENT: ${WEB_EXTRACTION_USER_AGENT:-DiscoveryApplicationBot/0.1}
      ENABLE_WELL_KNOWN_A2A: ${ENABLE_WELL_KNOWN_A2A:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      A2A_REGISTRY_BASE_URLS: ${A2A_REGISTRY_BASE_URLS:-}
      WELL_KNOWN_AGENT_HOSTS: ${WELL_KNOWN_AGENT_HOSTS:-}
      CONFIGURED_MCP_ENDPOINTS: ${CONFIGURED_MCP_ENDPOINTS:-}
      CONFIGURED_AGENT_CARD_URLS: ${CONFIGURED_AGENT_CARD_URLS:-}
      DISCOVERY_MAX_RESULTS_PER_SOURCE: ${DISCOVERY_MAX_RESULTS_PER_SOURCE:-20}
      SOURCE_CACHE_DIR: ${SOURCE_CACHE_DIR:-/data/discovery_cache}
    volumes:
      - ./platform/arcadedb/init:/app/arcadedb/init:ro
      # Persistent cache for downloaded repo trees/files/READMEs so a
      # container restart or rebuild doesn't wipe out already-downloaded
      # source code. DB (ArcadeDB) only stores a pointer (relative path)
      # into this volume.
      - agentic_discovery_platform_source_cache:/data/discovery_cache
    ports:
      - "8000:8000"
    depends_on:
      - arcadedb
    networks:
      - platform

  frontend:
    build:
      context: ./platform/frontend
    hostname: frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - platform

networks:
  platform:
    name: agentic-discovery-platform-network

volumes:
  agentic_discovery_platform_arcadedb_data:
    name: agentic_discovery_platform_arcadedb_data
  agentic_discovery_platform_source_cache:
    name: agentic_discovery_platform_source_cache